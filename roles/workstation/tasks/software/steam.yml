# As of 2020-09-30, multiarch is still required to be enabled in Debian and Ubuntu
# Note: Not required in Pop OS, apparently
- name: steam | add multiarch (debian, ubuntu)
  tags: steam,steam,multiarch
  lineinfile:
      dest: /var/lib/dpkg/arch
      regexp: "^i386"
      line: "i386"
      create: true
  when:
    - ansible_facts.distribution in ['Debian', 'Ubuntu']
    - steam is defined
    - steam

# For Debian and Ubuntu, set up acceptance of steam license before continuing
- name: software | steam | accept license
  tags: gaming,steam
  debconf:
    name: "steam"
    question: "steam/question"
    value: "I AGREE"
    vtype: "select"
  when:
    - ansible_facts.distribution in ["Debian", "Ubuntu"]
    - steam is defined
    - steam

- name: software | steam | install package
  tags: steam,steam
  package:
    state: latest
    name: "{{ steam_package }}"
  when:
    - steam is defined
    - steam

- name: software | steam | install steam-devices package (debian, ubuntu, etc)
  tags: steam,steam
  package:
    state: latest
    name: steam-devices
  when:
    - ansible_facts.distribution in ["Debian", "Pop!_OS", "Ubuntu"]
    - steam is defined
    - steam

- name: install vulkan drivers (debian, ubuntu, etc)
  tags: drivers,steam
  package:
    state: latest
    name: mesa-vulkan-drivers
  when:
    - ansible_facts.distribution in ["Debian", "Pop!_OS", "Ubuntu"]
    - steam is defined
    - steam
